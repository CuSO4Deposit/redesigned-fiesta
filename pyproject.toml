[project]
name = "pipeline"
version = "0.1.0"
description = "Build the public projections the homepage publishes."
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"
module-root = "src"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

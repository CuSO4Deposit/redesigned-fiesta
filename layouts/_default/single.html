{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{ if not .Params.url }}
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{ with .Params.tags }}<span class="tags">{{ range . }}<span>#{{ . }}</span> {{ end }}</span>{{ end }}
    </p>
    {{ end }}
  </header>
  <div class="post-content">{{ .Content }}</div>
  {{ if not .Params.url }}{{ partial "backlinks.html" . }}{{ end }}
</article>
{{ end }}

<nav class="menu">
  <ul>
    {{ range .Site.Menus.nav }}
    <li><a href="{{ .URL }}">{{ .Pre }}{{ .Name }}</a></li>
    {{ end }} {{ if .IsTranslated }} {{ range .AllTranslations }}
    <li>
      {{- if eq .Lang $.Lang -}}
      <span>{{ .Language.Label }}</span>
      {{- else -}}
      <a href="{{ .RelPermalink }}">{{ .Language.Label }}</a>
      {{- end -}}
    </li>
    {{ end }} {{ end }}
  </ul>
</nav>

<nav>
  <ul>
    {{- range site.Menus.nav }}
    <li><a href="{{ .URL }}">{{ .Name }}</a></li>
    {{- end }} {{- if .IsTranslated }} {{- range .AllTranslations }}
    <li>
      {{ if eq .Lang $.Lang }}<span>{{ .Language.Label }}</span>{{ else }}<a
        href="{{ .RelPermalink }}"
        >{{ .Language.Label }}</a
      >{{ end }}
    </li>
    {{- end }} {{- end }}
  </ul>
</nav>
